site_name: mongomock-ng
site_description: In-memory MongoDB mock for Python testing — drop-in replacement for pymongo
site_url: https://engFelipeMonteiro.github.io/mongomock-ng
repo_url: https://github.com/engFelipeMonteiro/mongomock-ng
repo_name: engFelipeMonteiro/mongomock-ng

extra:
  social:
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mongomock-ng/
    - icon: fontawesome/brands/github
      link: https://github.com/engFelipeMonteiro/mongomock-ng
  generator: false
  version:
    provider: mike

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - meta
  - def_list

nav:
  - Home: index.md
  - Getting Started: installation.md
  - Compatibility: compatibility.md
  - API Reference: API.md
  - Aggregation Pipeline: AGGREGATION.md
  - Geospatial Support: geospatial.md
  - Sessions & Transactions: sessions.md
  - Query Profiler: profiler.md
  - Limitations: LIMITATIONS.md
  - Changelog: CHANGELOG.md
  - Contributing: contributing.md

services:
  mongomock:
    build:
      context: .
    image: mongomock:latest
    working_dir: /project
    command: hatch test
    environment:
      - TEST_MONGO_HOST=mongodb://mongo/mock
      - MONGODB=7.0.34
    volumes:
      - .:/project
    depends_on:
      - mongo

  mongo:
    # The image chosen here should be kept in sync with the .travis.yml mongo version and with
    # the value in mongomock/__init__.py
    image: mongo:7.0.34
    ports:
      - 127.0.0.1:27017:27017
